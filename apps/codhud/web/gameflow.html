<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game flow</title>
<!--
  The Game flow board (1920x1080, transparent, over the boards' backdrop in
  the GFX Engine): a Hardpoint or Hijack game's score as it went, drawn live
  from the HUD's reading of the score box (/api/gameflow, codhud/gameflow.py).
    Hardpoint: each team's score at the end of every hill (P1..Pn), and the
      points each took on each hill of the rotation (POINTS PER HILL).
    Hijack: the scores over the two 4:00 halves (time remaining along the
      bottom), each throw / dunk drive as a +N box on its rise, and the
      points per half with each team's throws, dunks, runoff points and
      points per score.
  Laid out after the broadcast team's Game Flow Generator. Team colours,
  names and logos are the match's (the GFX Engine's Global information); the
  small heading is in the Global primary colour.
-->
<style>
  @font-face { font-family: "SCC fallback"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: var(--f-name, "SCC fallback"), "SCC fallback", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
  #stage.on { opacity: 1; }
  .kicker { position: absolute; left: 110px; top: 92px; font-size: 26px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .title { position: absolute; left: 110px; top: 126px; font-size: 64px; font-weight: 900; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
  svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg text { font-family: inherit; font-weight: 800; }
  .tick { fill: #e6e6e6; font-size: 26px; }
  .axis-name { fill: #fff; font-size: 20px; letter-spacing: .12em; }
  .grid { stroke: #fff; stroke-opacity: .12; stroke-width: 1.2; }
  .axis { stroke: #fff; stroke-width: 2; }
  .val { font-size: 26px; paint-order: stroke; stroke: rgba(10, 12, 14, .85); stroke-width: 6px; stroke-linejoin: round; }
  .line { fill: none; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  .draw .line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.6s cubic-bezier(.45, 0, .2, 1) .35s forwards; }
  .draw .pop { opacity: 0; animation: pop .45s ease forwards; }
  .draw .bar { transform-box: fill-box; transform: scaleX(0); animation: grow .7s cubic-bezier(.2, .8, .2, 1) forwards; }
  .draw .bar.r { transform-origin: 100% 50%; } .draw .bar.l { transform-origin: 0 50%; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; } }
  @keyframes grow { to { transform: none; } }
  .panel-head { font-size: 44px; fill: #fff; }
  .team-head { font-size: 19px; letter-spacing: .04em; }
  .row-label { fill: #e6e6e6; }
  .demo { position: absolute; right: 24px; bottom: 16px; font: 600 14px "SCC fallback", sans-serif; letter-spacing: .14em; color: #fff6; }
</style>
<style id="fonts"></style>
<!-- HUD Builder > Game HUDs: the changes saved for this design, applied over the page -->
<script src="/hudedit.js" data-design="cod-gameflow"></script>
</head>
<body>
<div id="stage">
  <div class="kicker" id="kicker"></div>
  <div class="title" id="title"></div>
  <svg id="svg" viewBox="0 0 1920 1080"></svg>
  <div class="demo" id="demo" hidden>DEMO GAME</div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";
  var drawnKey = null, firstDraw = true;

  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function src(path) { return /^(https?:|data:)/.test(path || "") ? path : "/" + String(path || "").split("/").map(encodeURIComponent).join("/"); }
  function rgb(hex) {
    var h = String(hex || "#888888").replace("#", "");
    if (h.length === 3) h = h.replace(/./g, "$&$&");
    var n = parseInt(h, 16);
    return isNaN(n) ? [136, 136, 136] : [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function lum(c) { return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255; }
  // Dark or white lettering, whichever reads on this colour.
  function textOn(hex) { return lum(rgb(hex)) > 0.55 ? "#141414" : "#ffffff"; }
  // A dark team colour is hard to read as text on the dark board: lightened just enough for text.
  function legible(hex) {
    var c = rgb(hex), mix = 0;
    var at = function (m) { return c.map(function (v) { return v + (255 - v) * m; }); };
    while (lum(at(mix)) < 0.45 && mix < 0.7) mix += 0.05;
    return "rgb(" + at(mix).map(Math.round).join(",") + ")";
  }
  function el(name, attrs, text) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function textWidth(str, size) { return 0.62 * size * String(str).length; }

  // --- the chart frame ----------------------------------------------------------------
  function frame(svg, box, xr, yr) {
    var sx = function (x) { return box.x + (x - xr[0]) / (xr[1] - xr[0]) * box.w; };
    var sy = function (y) { return box.y + box.h - (y - yr[0]) / (yr[1] - yr[0]) * box.h; };
    var g = el("g");
    for (var v = 0; v <= yr[1]; v += 50) {
      g.appendChild(el("line", { x1: box.x - 10, x2: box.x, y1: sy(v), y2: sy(v), class: "axis" }));
      g.appendChild(el("text", { x: box.x - 18, y: sy(v) + 9, "text-anchor": "end", class: "tick" }, v));
    }
    g.appendChild(el("line", { x1: box.x, x2: box.x, y1: box.y, y2: box.y + box.h, class: "axis" }));
    g.appendChild(el("line", { x1: box.x, x2: box.x + box.w, y1: box.y + box.h, y2: box.y + box.h, class: "axis" }));
    svg.appendChild(g);
    return { sx: sx, sy: sy };
  }
  function path(points) { return points.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" "); }
  function line(svg, points, colour, delay) {
    var p = el("path", { d: path(points), class: "line", stroke: colour });
    var len = 0;
    for (var i = 1; i < points.length; i++) len += Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
    p.style.setProperty("--len", Math.ceil(len + 2));
    if (delay) p.style.animationDelay = delay + "s";
    svg.appendChild(p);
  }
  // The team logos at the end of their lines, behind them, half see-through (leader on top, never overlapping).
  function logos(svg, d, ends, xmaxPx) {
    var size = 190, items = [];
    ["left", "right"].forEach(function (side, i) {
      if (!d[side].logo) return;
      items.push({ side: side, x: ends[i][0], y: ends[i][1] });
    });
    items.sort(function (a, b) { return a.y - b.y; });
    var prev = null, g = el("g", { opacity: 0.55 });
    items.forEach(function (it) {
      var cx = Math.min(it.x + 24 + size / 2, xmaxPx - size / 2), cy = it.y;
      cy = Math.max(cy, 60 + size / 2);
      if (prev) cy = Math.max(cy, prev + size + 10);
      prev = cy;
      var im = el("image", { x: cx - size / 2, y: cy - size / 2, width: size, height: size, preserveAspectRatio: "xMidYMid meet", class: "pop" });
      im.setAttributeNS("http://www.w3.org/1999/xlink", "href", src(d[it.side].logo));
      im.setAttribute("href", src(d[it.side].logo));
      im.style.animationDelay = "1.6s";
      g.appendChild(im);
    });
    svg.insertBefore(g, svg.firstChild);
  }

  // --- Hardpoint ----------------------------------------------------------------------
  function hardpoint(svg, d) {
    var hills = d.hills, n = hills.length - 1, top = Math.max(d.target, Math.max.apply(null, hills.map(function (h) { return Math.max(h[0], h[1]); })));
    var box = { x: 140, y: 230, w: 1100, h: 640 };
    var xmax = Math.max(n, 4) + 1.4;
    var f = frame(svg, box, [0, xmax], [-30, top * 1.12]);
    var cols = [d.left.color, d.right.color];
    for (var k = 1; k <= n; k++) svg.appendChild(el("line", { x1: f.sx(k), x2: f.sx(k), y1: box.y, y2: box.y + box.h, class: "grid" }));
    d.labels.forEach(function (lab, k) {
      svg.appendChild(el("text", { x: f.sx(k), y: box.y + box.h + 44, "text-anchor": "middle", class: "tick" }, lab));
    });
    [0, 1].forEach(function (t) {
      line(svg, hills.map(function (h, k) { return [f.sx(k), f.sy(h[t])]; }), cols[t]);
    });
    hills.forEach(function (h, k) {
      if (!k) return;
      [0, 1].forEach(function (t) {
        var v = h[t], o = h[1 - t], up = v >= o;
        var tx = el("text", { x: f.sx(k), y: f.sy(v) + (up ? -18 : 42), "text-anchor": "middle", class: "val pop", fill: "#fff" }, v);
        tx.style.animationDelay = (0.35 + 1.6 * k / n) + "s";
        svg.appendChild(tx);
      });
    });
    logos(svg, d, [[f.sx(n), f.sy(hills[n][0])], [f.sx(n), f.sy(hills[n][1])]], box.x + box.w + 70);
    // POINTS PER HILL
    var px = 1330, pw = 500, lab = 70, rows = Math.max(6, d.per_hill.length), top0 = 230, rh = 640 / rows;
    svg.appendChild(el("text", { x: px + lab, y: 172, class: "panel-head" }, "POINTS PER HILL"));
    svg.appendChild(el("text", { x: px + lab, y: top0 - 14, class: "team-head", fill: legible(cols[0]) }, String(d.left.name || "").toUpperCase()));
    svg.appendChild(el("text", { x: px + pw, y: top0 - 14, class: "team-head", "text-anchor": "end", fill: legible(cols[1]) }, String(d.right.name || "").toUpperCase()));
    var fs = Math.max(20, Math.min(40, rh * 0.42)), span = pw - lab;
    d.per_hill.forEach(function (p, i) {
      var y = top0 + i * rh + rh * 0.08, h = rh * 0.84, tot = p[0] + p[1];
      var need = function (v) { return textWidth(v, fs) + 26; };
      var wl = tot ? span * p[0] / tot : span / 2;
      wl = Math.max(wl, need(p[0]));
      var wr = Math.max(span - wl, need(p[1]));
      wl = span - wr;
      var g = el("g");
      var bl = el("rect", { x: px + lab, y: y, width: wl, height: h, fill: cols[0], class: "bar l" });
      var br = el("rect", { x: px + lab + wl, y: y, width: wr, height: h, fill: cols[1], class: "bar r" });
      bl.style.animationDelay = br.style.animationDelay = (0.4 + i * 0.12) + "s";
      g.appendChild(bl); g.appendChild(br);
      var ym = y + h / 2 + fs * 0.36;
      g.appendChild(el("text", { x: px + lab - 12, y: ym, "text-anchor": "end", class: "row-label", "font-size": fs * 0.9 }, "P" + (i + 1)));
      var a = el("text", { x: px + lab + 14, y: ym, fill: textOn(cols[0]), "font-size": fs, class: "pop" }, p[0]);
      var b = el("text", { x: px + pw - 14, y: ym, "text-anchor": "end", fill: textOn(cols[1]), "font-size": fs, class: "pop" }, p[1]);
      a.style.animationDelay = b.style.animationDelay = (0.8 + i * 0.12) + "s";
      g.appendChild(a); g.appendChild(b);
      svg.appendChild(g);
    });
  }

  // --- Hijack ----------------------------------------------------------------------------
  function hijack(svg, d, accent) {
    var H = d.half_seconds, GAP = 45, pts = d.points, cols = [d.left.color, d.right.color], tt = cols.map(legible);
    var xpos = function (t, h) { return h === 1 ? Math.min(t, H) : Math.min(Math.max(t, H), 2 * H) + GAP; };
    var xEnd = 2 * H + GAP, xExt = xEnd + 40;
    var top = Math.max(d.targets[1], Math.max.apply(null, pts.map(function (p) { return Math.max(p[1], p[2]); })));
    var box = { x: 140, y: 230, w: 1140, h: 640 };
    var f = frame(svg, box, [-3, xEnd + 120], [-30, top * 1.2]);
    // each half's target, dashed
    [[0, H, d.targets[0]], [H + GAP, xEnd, d.targets[1]]].forEach(function (s) {
      svg.appendChild(el("line", { x1: f.sx(s[0]), x2: f.sx(s[1]), y1: f.sy(s[2]), y2: f.sy(s[2]), stroke: "#fff", "stroke-opacity": .35,
                                   "stroke-dasharray": "10 8", "stroke-width": 2 }));
    });
    // time remaining, 4:00 .. 0:00 in each half
    [0, H + GAP].forEach(function (base) {
      for (var k = 0; k <= 4; k++) {
        var x = f.sx(base + k * 60);
        if (!(k === 4 && base === 0) && !(k === 0 && base)) svg.appendChild(el("line", { x1: x, x2: x, y1: box.y, y2: box.y + box.h, class: "grid" }));
        svg.appendChild(el("text", { x: x, y: box.y + box.h + 40, "text-anchor": "middle", class: "tick", "font-size": 22 }, (4 - k) + ":00"));
      }
    });
    svg.appendChild(el("text", { x: f.sx(H + GAP / 2), y: box.y + box.h + 80, "text-anchor": "middle", class: "axis-name" }, "TIME REMAINING"));
    var xdiv = f.sx(H + GAP / 2);
    [[-1, "1ST HALF", d.targets[0]], [1, "2ND HALF", d.targets[1]]].forEach(function (s) {
      var anchor = s[0] < 0 ? "end" : "start";
      svg.appendChild(el("text", { x: xdiv + s[0] * 12, y: box.y + 24, "text-anchor": anchor, fill: accent, "font-size": 26 }, s[1]));
      svg.appendChild(el("text", { x: xdiv + s[0] * 12, y: box.y + 54, "text-anchor": anchor, fill: "#fff", "fill-opacity": .6, "font-size": 19 }, "FIRST TO " + s[2]));
    });
    var i1 = pts.filter(function (p) { return p[3] === 1; }), i2 = pts.filter(function (p) { return p[3] === 2; });
    [1, 2].forEach(function (t) {   // (point index 1 = left, 2 = right)
      var c = cols[t - 1];
      if (i1.length) line(svg, i1.map(function (p) { return [f.sx(xpos(p[0], 1)), f.sy(p[t])]; }), c);
      if (i2.length) {
        if (i1.length) {   // the score carries across halftime: colour up to 0:00, grey from 0:00 to the 2nd half's 4:00
          var a = i1[i1.length - 1], y = f.sy(a[t]);
          line(svg, [[f.sx(xpos(a[0], 1)), y], [f.sx(H), y]], c, 1.0);
          line(svg, [[f.sx(H), y], [f.sx(H + GAP), f.sy(i2[0][t])]], "#8a8a8a", 1.0);
        }
        var seg = i2.map(function (p) { return [f.sx(xpos(p[0], 2)), f.sy(p[t])]; });
        if (d.finished) seg.push([f.sx(xExt), f.sy(i2[i2.length - 1][t])]);
        line(svg, seg, c, 1.0);
      }
    });
    svg.appendChild(el("line", { x1: xdiv, x2: xdiv, y1: box.y, y2: box.y + box.h, stroke: accent, "stroke-width": 5 }));
    // a +N box on each drive's rise, and the running total above it
    var placed = [];
    var hits = function (r) { return placed.some(function (o) { return r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]; }); };
    var last = {};
    d.drives.forEach(function (dv) { last[dv.team] = dv; });
    d.drives.forEach(function (dv) {
      var x = f.sx(xpos(dv.t, dv.half)), y0 = f.sy(dv.y0), y1 = f.sy(dv.y1), lab = "+" + dv.total;
      var fs = Math.max(15, Math.min(22, (y0 - y1) * 0.55)), w = textWidth(lab, fs) + 10, h = fs * 1.25, cy = (y0 + y1) / 2;
      var g = el("g", { class: "pop" });
      g.style.animationDelay = "1.9s";
      g.appendChild(el("rect", { x: x - w / 2, y: cy - h / 2, width: w, height: h, rx: 4, fill: cols[dv.team] }));
      g.appendChild(el("text", { x: x, y: cy + fs * 0.36, "text-anchor": "middle", fill: textOn(cols[dv.team]), "font-size": fs }, lab));
      svg.appendChild(g);
      placed.push([x - w / 2, cy - h / 2, x + w / 2, cy + h / 2]);
    });
    var nums = d.drives.filter(function (dv) { return !(d.finished && last[dv.team] === dv); })
      .map(function (dv) { return [xpos(dv.t, dv.half), dv.y1, dv.team]; });
    [1, 2].forEach(function (h) {   // a team that didn't score in a half: what it carried to the end of it
      var hp = pts.filter(function (p) { return p[3] === h; });
      if (!hp.length || (d.finished && h === 2)) return;
      var e = hp[hp.length - 1];
      [0, 1].forEach(function (team) {
        if (!d.drives.some(function (dv) { return dv.team === team && dv.half === h; })) nums.push([xpos(Math.min(e[0], h * H), h), e[team + 1], team]);
      });
    });
    if (d.finished) {
      var fin = [pts[pts.length - 1][1], pts[pts.length - 1][2]];
      [0, 1].forEach(function (team) {
        var ahead = fin[team] > fin[1 - team] || (fin[team] === fin[1 - team] && team === 0);
        var x = f.sx(xExt - 26), y = f.sy(fin[team]) + (ahead ? -16 : 46), w = textWidth(fin[team], 40);
        var t = el("text", { x: x, y: y, "text-anchor": "middle", fill: tt[team], "font-size": 40, class: "val pop" }, fin[team]);
        t.style.animationDelay = "2.1s";
        svg.appendChild(t);
        placed.push([x - w / 2, y - 36, x + w / 2, y + 4]);
      });
    }
    nums.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).forEach(function (n) {
      var x = f.sx(n[0]), size = 26, off = 12, w, r;
      for (;;) {
        w = textWidth(n[1], size);
        r = [x - w / 2, f.sy(n[1]) - off - size, x + w / 2, f.sy(n[1]) - off];
        if (!hits(r) || size <= 17) break;
        size -= 1;
      }
      while (hits(r) && off < 120) { off += 6; r = [x - w / 2, f.sy(n[1]) - off - size, x + w / 2, f.sy(n[1]) - off]; }
      placed.push(r);
      var t = el("text", { x: x, y: f.sy(n[1]) - off, "text-anchor": "middle", fill: tt[n[2]], "font-size": size, class: "val pop" }, n[1]);
      t.style.animationDelay = "2s";
      svg.appendChild(t);
    });
    var e1 = pts[pts.length - 1];
    var endX = f.sx(d.finished ? xExt : xpos(e1[0], e1[3]));
    logos(svg, d, [[endX, f.sy(e1[1])], [endX, f.sy(e1[2])]], box.x + box.w + 60);
    // POINTS PER HALF, and the scoring stats
    var x0 = 1370, x1 = 1850, lab = 80, xb = x0 + lab;
    svg.appendChild(el("text", { x: xb, y: 172, class: "panel-head" }, "POINTS PER HALF"));
    svg.appendChild(el("text", { x: xb, y: 230 - 14, class: "team-head", fill: tt[0] }, String(d.left.name || "").toUpperCase()));
    svg.appendChild(el("text", { x: x1, y: 230 - 14, class: "team-head", "text-anchor": "end", fill: tt[1] }, String(d.right.name || "").toUpperCase()));
    var bh = 92;
    d.per_half.forEach(function (p, k) {
      var y = 230 + k * 118, g = el("g");
      var lb = el("text", { x: x0 + lab / 2 - 6, y: y + bh / 2 - 4, "text-anchor": "middle", class: "row-label", "font-size": 22 }, k ? "2ND" : "1ST");
      g.appendChild(lb);
      g.appendChild(el("text", { x: x0 + lab / 2 - 6, y: y + bh / 2 + 22, "text-anchor": "middle", class: "row-label", "font-size": 22 }, "HALF"));
      if (!p) {
        g.appendChild(el("rect", { x: xb, y: y, width: x1 - xb, height: bh, fill: "#2a2a2a" }));
        g.appendChild(el("text", { x: (xb + x1) / 2, y: y + bh / 2 + 12, "text-anchor": "middle", fill: "#777", "font-size": 32 }, "–"));
      } else {
        var tot = p[0] + p[1], wl = (x1 - xb) * (tot > 0 ? p[0] / tot : .5);
        var need = function (v) { return textWidth(v, 38) + 26; };
        wl = Math.min(Math.max(wl, need(p[0])), x1 - xb - need(p[1]));
        var bl = el("rect", { x: xb, y: y, width: wl, height: bh, fill: cols[0], class: "bar l" });
        var br = el("rect", { x: xb + wl, y: y, width: x1 - xb - wl, height: bh, fill: cols[1], class: "bar r" });
        bl.style.animationDelay = br.style.animationDelay = (0.4 + k * 0.15) + "s";
        g.appendChild(bl); g.appendChild(br);
        g.appendChild(el("text", { x: xb + 14, y: y + bh / 2 + 14, fill: textOn(cols[0]), "font-size": 38 }, p[0]));
        g.appendChild(el("text", { x: x1 - 14, y: y + bh / 2 + 14, "text-anchor": "end", fill: textOn(cols[1]), "font-size": 38 }, p[1]));
      }
      svg.appendChild(g);
    });
    [["THROWS (+15)", "throws"], ["DUNKS (+30)", "dunks"], ["RUNOFF POINTS", "runoff"], ["AVG POINTS / SCORE", "avg"]].forEach(function (r, k) {
      var y = 480 + k * 98, h = 80, g = el("g", { class: "pop" });
      g.style.animationDelay = (0.9 + k * 0.1) + "s";
      g.appendChild(el("rect", { x: xb, y: y, width: x1 - xb, height: h, fill: "#202020", "fill-opacity": .92 }));
      g.appendChild(el("text", { x: (xb + x1) / 2, y: y + h / 2 + 7, "text-anchor": "middle", fill: "#bdbdbd", "font-size": 18 }, r[0]));
      [0, 1].forEach(function (side) {
        var v = d.stats[side][r[1]];
        g.appendChild(el("text", { x: side ? x1 - 16 : xb + 16, y: y + h / 2 + 12, "text-anchor": side ? "end" : "start", fill: tt[side], "font-size": 32 },
                         v == null ? "–" : (r[1] === "avg" ? Number(v).toFixed(1) : v)));
      });
      svg.appendChild(g);
    });
  }

  function render(d) {
    var key = JSON.stringify(d);
    if (key === drawnKey) return;
    drawnKey = key;
    var fam = String((d.fonts || {}).name || "").replace(/["\\]/g, "");
    $("fonts").textContent = (fam ? '@font-face { font-family: "SCC name"; src: local("' + fam + '"), url("/fonts/local/' + encodeURIComponent(fam) + '"); font-weight: 100 900; }' : "") +
      ":root { --f-name: " + (fam ? '"' + fam + '", "SCC name", ' : "") + '"SCC fallback"; }';
    var accent = d.accent || "#ffc52a";
    $("kicker").style.color = accent;
    $("kicker").textContent = "GAME FLOW / MAP " + (d.map_no || 1);
    $("title").textContent = (d.mode_name || "") + (d.map ? " // " + d.map : "");
    $("demo").hidden = !d.demo;
    var svg = $("svg");
    svg.innerHTML = "";
    svg.classList.toggle("draw", firstDraw);
    if (!d.empty) {
      if (d.mode === "hijack") hijack(svg, d, accent); else hardpoint(svg, d);
    }
    firstDraw = false;
    $("stage").classList.add("on");
  }

  function poll() {
    fetch("/api/gameflow", { cache: "no-store" }).then(function (r) { return r.json(); }).then(render)
      .catch(function () { /* the HUD is restarting */ })
      .then(function () { setTimeout(poll, 1000); });
  }
  window.gameFlow = { render: render };   // (for checking the page)
  poll();
})();
</script>
</body>
</html>
